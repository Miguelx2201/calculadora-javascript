<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>
    <h1 id="titulo" class="titulo">Calculadora</h1>
    <div class="contenedor">
        <label id="expresion" class="expresion">Expresion</label>
        <div class="fila">
            <div class="boton">+</div>
            <div class="boton">-</div>
            <div class="boton">X</div>
            <div class="boton">/</div>
        </div>
        <div class="fila">
            <div class="boton">7</div>
            <div class="boton">8</div>
            <div class="boton">9</div>
        </div>
        <div class="fila">
            <div class="boton">4</div>
            <div class="boton">5</div>
            <div class="boton">6</div>
        </div>
        <div class="fila">
            <div class="boton">1</div>
            <div class="boton">2</div>
            <div class="boton">3</div>
        </div>
        <div class="fila">
            <div class="boton">0</div>
            <div class="boton">,</div>
            <div class="boton">=</div>
        </div>    
    </div>
</body>
</html>
